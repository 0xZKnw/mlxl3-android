[package]
name = "mlxl3-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
ash = "0.38.0"
half = "2.7"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(kani_float_checks)'] }
