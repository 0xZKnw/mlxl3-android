name: Android APK
on:
  push:
    branches: [main, 'codex/**']
    paths: ['app/**', 'engine/**', 'scripts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'engine/**', 'scripts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      GLSLC: /usr/local/lib/android/sdk/ndk/27.2.12479018/shader-tools/linux-x86_64/glslc
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          cache-on-failure: true
      - name: Android NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'ndk;27.2.12479018 platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate Rust and shaders
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --check
          cargo clippy --manifest-path engine/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --locked
          find engine/target/debug/build -path '*/out/*.spv' -exec "$ANDROID_NDK_HOME/shader-tools/linux-x86_64/spirv-val" --target-env vulkan1.1 {} \;
      - name: Build ARM64 engine
        run: |
          cargo clippy --manifest-path engine/Cargo.toml --locked --lib --target aarch64-linux-android -- -D warnings
          scripts/build-native.sh
      - name: Test, lint and assemble installable APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MLXL3-Android-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/reports/
          retention-days: 7

  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-upgrade --no-install-recommends glslc
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          command: cargo kani
          args: --manifest-path engine/Cargo.toml --lib --harness codebook_offsets_are_aligned_bounded_and_reject_invalid_ids
      - name: All CPU proof harnesses
        run: cargo kani --manifest-path engine/Cargo.toml --lib

  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Software Vulkan and shader compiler
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq
          sudo apt-get install -y --no-upgrade --no-install-recommends glslc libvulkan1 mesa-vulkan-drivers
      - name: EXL3 projection and complete reduced-model tests
        run: |
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::codebooks -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --test vulkan -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --test flow -- --ignored --test-threads=1

      - name: Compare lookup and procedural projections after parity
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            rustc -Vv
            glslc --version
            sha256sum engine/shaders/qmv.comp engine/shaders/exl3*.glsl
            find engine/target/debug/build -path '*/out/qmv*.spv' -exec sha256sum {} \;
            cargo test --manifest-path engine/Cargo.toml --locked --lib benchmark_codebook_lookup -- --ignored --test-threads=1 --nocapture
          } > projection-benchmark.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: projection-benchmark
          path: |
            projection-benchmark.log
            engine/target/debug/build/*/out/qmv*.spv
          if-no-files-found: warn
          retention-days: 14

  ui:
    strategy:
      fail-fast: false
      matrix:
        display: [small, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            if [ "${{ matrix.display }}" = phone ]; then adb shell wm size 1080x2400; adb shell wm density 420; fi
            ./gradlew --no-daemon -PuiTest :app:connectedDebugAndroidTest
            adb pull /sdcard/Pictures/MLXL3-tests ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-screenshots-${{ matrix.display }}
          path: ui-screenshots/
          if-no-files-found: warn
