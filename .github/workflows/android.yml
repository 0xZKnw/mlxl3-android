name: Android APK
on:
  push:
    branches: [main, 'codex/**']
    paths: ['app/**', 'engine/**', 'scripts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'engine/**', 'scripts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      GLSLC: /usr/local/lib/android/sdk/ndk/27.2.12479018/shader-tools/linux-x86_64/glslc
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          cache-on-failure: true
      - name: Android NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'ndk;27.2.12479018 platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate Rust and shaders
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --check
          cargo clippy --manifest-path engine/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --locked
          find engine/target/debug/build -path '*/out/*.spv' -print0 | xargs -0 -r -n1 "$ANDROID_NDK_HOME/shader-tools/linux-x86_64/spirv-val" --target-env vulkan1.1
      - name: Build ARM64 engine
        run: |
          cargo clippy --manifest-path engine/Cargo.toml --locked --lib --target aarch64-linux-android -- -D warnings
          scripts/build-native.sh
      - name: Test, lint and assemble installable APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare direct APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MLXL3-Android-${GITHUB_SHA}.apk"
          (cd dist && sha256sum "MLXL3-Android-${GITHUB_SHA}.apk" > SHA256SUMS)
      - name: Upload installable APK without ZIP
        id: apk_download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MLXL3-Android-${{ github.sha }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Direct APK download link
        env:
          APK_URL: ${{ steps.apk_download.outputs.artifact-url }}
          APK_DIGEST: ${{ steps.apk_download.outputs.artifact-digest }}
        run: |
          {
            echo '## Installable Android APK'
            printf '[Download APK (no ZIP)](%s)\n\n' "$APK_URL"
            echo 'Open in a browser signed into GitHub. The link keeps the normal Actions access rules and expires with the artifact after 14 days.'
            echo
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'SHA-256: `%s`\n' "$APK_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload checksums and instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-checksum-${{ github.sha }}
          path: |
            dist/SHA256SUMS
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/reports/
          retention-days: 7

  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-upgrade --no-install-recommends glslc
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          command: cargo kani
          args: --manifest-path engine/Cargo.toml --lib --harness memory_selection_checks_flags_and_prefers_local_for_four_types
      - name: All CPU proof harnesses
        run: cargo kani --manifest-path engine/Cargo.toml --lib

  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Software Vulkan and shader compiler
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq
          sudo apt-get install -y --no-upgrade --no-install-recommends glslc libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      - name: EXL3 projection and complete reduced-model tests
        run: |
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::multiwave_shared -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::codebooks -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::native_codebooks -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::stream_qmv -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::prepared_projection -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::grouped_projections -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::resident_ -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::persistent_scratch -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --test vulkan -- --ignored --test-threads=1
          cargo test --manifest-path engine/Cargo.toml --locked --test flow -- --ignored --test-threads=1

      - name: Validate grouped command, memory and query synchronization
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          VK_LOADER_DEBUG: layer
        run: |
          dpkg-query -W vulkan-validationlayers
          {
            cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::grouped_projections -- --ignored --test-threads=1
            cargo test --manifest-path engine/Cargo.toml --locked --lib vulkan::tests::resident_ -- --ignored --test-threads=1
            cargo test --manifest-path engine/Cargo.toml --locked --test flow -- --ignored --test-threads=1
          } 2>&1 | tee synchronization-validation.log
          if grep -E 'Validation Error|VUID-|SYNC-HAZARD' synchronization-validation.log; then exit 1; fi
          grep -E 'Insert instance layer.*VK_LAYER_KHRONOS_validation' synchronization-validation.log > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-synchronization-checks
          path: synchronization-validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Compare lookup and procedural projections after parity
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            rustc -Vv
            glslc --version
            sha256sum engine/shaders/qmv.comp engine/shaders/exl3*.glsl
            find engine/target/debug/build -path '*/out/qmv*.spv' -exec sha256sum {} \;
            cargo test --manifest-path engine/Cargo.toml --locked --lib benchmark_codebook_lookup -- --ignored --test-threads=1 --nocapture
          } > projection-benchmark.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: projection-benchmark
          path: |
            projection-benchmark.log
            engine/target/debug/build/*/out/qmv*.spv
          if-no-files-found: warn
          retention-days: 14

  ui:
    strategy:
      fail-fast: false
      matrix:
        display: [small, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            if [ "${{ matrix.display }}" = phone ]; then adb shell wm size 1080x2400; adb shell wm density 420; fi
            ./gradlew --no-daemon -PuiTest :app:connectedDebugAndroidTest
            adb pull /sdcard/Pictures/MLXL3-tests ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-screenshots-${{ matrix.display }}
          path: ui-screenshots/
          if-no-files-found: warn
